<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupa &amp; Naresh | Wedding Celebration</title>
<meta name="description" content="Join Rupa and Naresh as they begin their beautiful journey together on March 9, 2027, at Raja Gopala Swamy Temple, Narsapur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>/* ════════════════════════════════════════════════════════════
   RUPA & NARESH — Premium Wedding Website Styles
   ════════════════════════════════════════════════════════════ */

:root {
  /* Color palette */
  --blush-pink: #F4D5DC;
  --soft-lavender: #DCD5F2;
  --warm-white: #FFFDFB;
  --peach: #F7D6C5;
  --beige: #E9D8C5;
  --champagne-gold: #D4AF6A;
  --deep-rose: #874F64;
  --charcoal: #443B43;
  --soft-sage: #C8D8C1;

  /* Extended ramps */
  --primary-50: #FDF2F4;
  --primary-100: #F4D5DC;
  --primary-300: #E8A8B8;
  --primary-500: #C97890;
  --primary-700: #874F64;
  --primary-900: #5C3340;

  --accent-50: #FBF6EC;
  --accent-100: #F0E6D0;
  --accent-300: #D4AF6A;
  --accent-500: #B8923F;
  --accent-700: #8C6E2E;

  --success-100: #D4EDDA;
  --success-500: #28A745;
  --warning-100: #FFF3CD;
  --warning-500: #E8A838;
  --error-100: #F8D7DA;
  --error-500: #C0392B;

  --neutral-50: #FAF8F6;
  --neutral-100: #F5F0EB;
  --neutral-200: #E9D8C5;
  --neutral-400: #A89B96;
  --neutral-600: #6B5F63;
  --neutral-800: #443B43;

  /* Fonts */
  --font-heading: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
  --font-script: 'Great Vibes', cursive;

  /* Spacing (8px system) */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;
  --space-5: 2.5rem;
  --space-6: 3rem;
  --space-8: 4rem;
  --space-10: 5rem;
  --space-12: 6rem;

  /* Transitions */
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* Shadows */
  --shadow-sm: 0 2px 8px rgba(68, 59, 67, 0.06);
  --shadow-md: 0 4px 20px rgba(68, 59, 67, 0.1);
  --shadow-lg: 0 10px 40px rgba(68, 59, 67, 0.12);
  --shadow-gold: 0 0 30px rgba(212, 175, 106, 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: var(--font-body);
  background-color: var(--warm-white);
  color: var(--charcoal);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5 {
  font-family: var(--font-heading);
  font-weight: 500;
  line-height: 1.2;
  color: var(--deep-rose);
}

p {
  line-height: 1.6;
}

a {
  color: var(--champagne-gold);
  text-decoration: none;
  transition: color 0.3s var(--ease);
}

button {
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  height: auto;
}

/* ═══ Layout ═══ */
.section {
  padding: var(--space-12) var(--space-2);
  position: relative;
}

.section-inner {
  max-width: 1200px;
  margin: 0 auto;
}

.section-label {
  font-family: var(--font-body);
  font-size: 0.75rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--champagne-gold);
  text-align: center;
  margin-bottom: var(--space-2);
  font-weight: 500;
}

.section-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  text-align: center;
  margin-bottom: var(--space-2);
}

.section-subtitle {
  font-size: 1.1rem;
  color: var(--neutral-600);
  text-align: center;
  max-width: 600px;
  margin: 0 auto var(--space-6);
}

.script-text {
  font-family: var(--font-script);
  font-size: 1.5em;
  color: var(--champagne-gold);
}

/* ═══ Gold Divider ═══ */
.gold-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  margin: var(--space-4) auto;
  max-width: 300px;
}
.gold-divider::before,
.gold-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--champagne-gold), transparent);
}
.gold-divider span {
  font-size: 1.2rem;
  color: var(--champagne-gold);
}

/* ═══ Buttons ═══ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.75rem;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 50px;
  transition: all 0.35s var(--ease);
  text-decoration: none;
  border: 1.5px solid transparent;
  letter-spacing: 0.02em;
}

.btn-primary {
  background: linear-gradient(135deg, var(--deep-rose), var(--primary-500));
  color: var(--warm-white);
  border-color: var(--deep-rose);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-gold);
  background: linear-gradient(135deg, var(--primary-500), var(--deep-rose));
}

.btn-outline {
  background: transparent;
  color: var(--deep-rose);
  border-color: var(--champagne-gold);
}
.btn-outline:hover {
  background: var(--accent-50);
  border-color: var(--deep-rose);
  transform: translateY(-2px);
}

.btn-gold {
  background: linear-gradient(135deg, var(--champagne-gold), var(--accent-500));
  color: var(--warm-white);
  border-color: var(--champagne-gold);
}
.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-gold);
}

/* ═══ Navigation ═══ */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: var(--space-2) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.4s var(--ease);
}

.navbar.scrolled {
  background: rgba(255, 253, 251, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-sm);
  padding: var(--space-1) var(--space-4);
}

.nav-logo {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--deep-rose);
  letter-spacing: 0.05em;
  text-decoration: none;
  z-index: 1001;
}
.nav-logo .heart {
  color: var(--champagne-gold);
  font-size: 0.9em;
}

.nav-links {
  display: flex;
  gap: var(--space-3);
  list-style: none;
  align-items: center;
}

.nav-links a {
  color: var(--charcoal);
  font-size: 0.9rem;
  font-weight: 500;
  text-decoration: none;
  position: relative;
  padding: 0.25rem 0;
  transition: color 0.3s var(--ease);
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--champagne-gold);
  transition: width 0.3s var(--ease);
}

.nav-links a:hover {
  color: var(--deep-rose);
}
.nav-links a:hover::after {
  width: 100%;
}

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.5rem;
  z-index: 1001;
}
.nav-toggle span {
  width: 24px;
  height: 2px;
  background: var(--deep-rose);
  border-radius: 2px;
  transition: all 0.3s var(--ease);
}
.nav-toggle.active span:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}
.nav-toggle.active span:nth-child(2) {
  opacity: 0;
}
.nav-toggle.active span:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}

/* ═══ Hero ═══ */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: url('home-bg.webp') center center / cover no-repeat;
}

.hero-decorations {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.hero-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-8);
  align-items: center;
  max-width: 1200px;
  width: 100%;
  padding: var(--space-8) var(--space-2);
  position: relative;
  z-index: 2;
}

.hero-text {
  text-align: left;
}

.hero-label {
  font-size: 0.8rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--champagne-gold);
  font-weight: 500;
  margin-bottom: var(--space-2);
}

.hero-title {
  font-size: clamp(2rem, 6vw, 4.5rem);
  font-weight: 400;
  color: var(--deep-rose);
  line-height: 1;
  margin-bottom: var(--space-2);
}
.hero-title .amp {
  font-family: var(--font-script);
  color: var(--champagne-gold);
  font-size: 0.8em;
}

.hero-subtitle {
  font-size: 1.25rem;
  color: var(--neutral-600);
  margin-bottom: var(--space-3);
  max-width: 450px;
}

.hero-invitation {
  font-style: italic;
  color: var(--neutral-600);
  margin-bottom: var(--space-4);
  max-width: 450px;
  font-size: 1rem;
}

.hero-details {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-bottom: var(--space-5);
}
.hero-detail {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.hero-detail .label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--champagne-gold);
}
.hero-detail .value {
  font-family: var(--font-heading);
  font-size: 1.15rem;
  color: var(--deep-rose);
}

.hero-cta {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.hero-illustration-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
}

.hero-illustration-wrapper .hero-photo {
  width: 350px;
  height: 450px;
  overflow: hidden;
  border-radius: 20px;
  filter: drop-shadow(0 10px 40px rgba(135, 79, 100, 0.15));
}

.hero-illustration-wrapper .hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Floating hearts animation */
.float-heart {
  animation: floatUp 6s ease-in-out infinite;
}
.float-heart:nth-child(2) { animation-delay: 1s; }
.float-heart:nth-child(3) { animation-delay: 2s; }
.float-heart:nth-child(4) { animation-delay: 3s; }
.float-heart:nth-child(5) { animation-delay: 4s; }
.float-heart:nth-child(6) { animation-delay: 5s; }

@keyframes floatUp {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
  50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
}

/* ═══ Love Story Timeline ═══ */
.story-section {
  background: linear-gradient(180deg, var(--warm-white), var(--primary-50));
}

.story-intro {
  text-align: center;
  max-width: 700px;
  margin: 0 auto var(--space-8);
  font-size: 1.15rem;
  color: var(--neutral-600);
  font-style: italic;
}

.timeline {
  position: relative;
  max-width: 900px;
  margin: 0 auto;
  padding: var(--space-4) 0;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, transparent, var(--champagne-gold), var(--champagne-gold), transparent);
  transform: translateX(-50%);
}

.timeline-item {
  display: flex;
  align-items: center;
  margin-bottom: var(--space-6);
  position: relative;
}

.timeline-item:nth-child(odd) {
  justify-content: flex-end;
}
.timeline-item:nth-child(odd) .timeline-content {
  text-align: right;
  margin-right: var(--space-6);
}
.timeline-item:nth-child(even) .timeline-content {
  margin-left: var(--space-6);
}

.timeline-content {
  width: 45%;
  background: var(--warm-white);
  padding: var(--space-3);
  border-radius: 16px;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(212, 175, 106, 0.15);
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
}
.timeline-content:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.timeline-content h3 {
  font-size: 1.4rem;
  margin-bottom: var(--space-1);
  color: var(--deep-rose);
}

.timeline-content .timeline-date {
  font-size: 0.8rem;
  color: var(--champagne-gold);
  letter-spacing: 0.1em;
  margin-bottom: var(--space-1);
  font-weight: 500;
}

.timeline-content p {
  font-size: 0.95rem;
  color: var(--neutral-600);
}

.timeline-marker {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  background: var(--warm-white);
  border: 2px solid var(--champagne-gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  box-shadow: var(--shadow-sm);
}
.timeline-marker svg {
  width: 18px;
  height: 18px;
  fill: var(--deep-rose);
}

/* ═══ Wedding Events ═══ */
.events-section {
  background: linear-gradient(180deg, var(--primary-50), var(--warm-white));
}

.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--space-4);
  margin-top: var(--space-6);
}

.event-card {
  background: var(--warm-white);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(212, 175, 106, 0.15);
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
  display: flex;
  flex-direction: column;
}
.event-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

.event-illustration {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.event-illustration svg {
  height: 100%;
  width: 100%;
}

/* Event photo - show the full image */
.event-photo {
  width: 100% !important;
  height: 200px !important;
  overflow: hidden !important;
  border-radius: 0;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fdf8f2;
}

.event-photo img {
  width: 100% !important;
  height: 200px !important;
  max-width: 100% !important;
  max-height: 200px !important;
  object-fit: contain !important;
  object-position: center center !important;
  display: block;
}
.event-body {
  padding: var(--space-3);
  flex: 1;
  display: flex;
  flex-direction: column;
}

.event-name {
  font-size: 1.6rem;
  color: var(--deep-rose);
  margin-bottom: var(--space-1);
}

.event-detail-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: var(--neutral-600);
  margin-bottom: 0.4rem;
}
.event-detail-row svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--champagne-gold);
}

.event-description {
  font-size: 0.85rem;
  color: var(--neutral-600);
  margin-top: var(--space-1);
  font-style: italic;
  flex: 1;
}

.event-add-calendar {
  margin-top: var(--space-2);
  font-size: 0.8rem;
  color: var(--champagne-gold);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}

.event-add-calendar svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.event-add-calendar:hover {
  color: var(--deep-rose);
}

/* ═══ Countdown ═══ */
.countdown-section {
  background: linear-gradient(170deg, var(--soft-lavender), var(--primary-50));
}

.countdown-card {
  background: rgba(255, 253, 251, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(212, 175, 106, 0.2);
  border-radius: 24px;
  padding: var(--space-6);
  max-width: 700px;
  margin: 0 auto;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.countdown-timer {
  display: flex;
  justify-content: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-top: var(--space-4);
}

.countdown-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 90px;
}

.countdown-number {
  font-family: var(--font-heading);
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 600;
  color: var(--deep-rose);
  line-height: 1;
  background: var(--warm-white);
  border-radius: 16px;
  width: 100%;
  padding: var(--space-2) 0;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212, 175, 106, 0.15);
}

.countdown-label {
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--champagne-gold);
  margin-top: var(--space-1);
  font-weight: 500;
}

.countdown-celebrate {
  font-family: var(--font-heading);
  font-size: 2rem;
  color: var(--deep-rose);
  padding: var(--space-4);
  text-align: center;
}

/* ═══ Scratch Card ═══ */
.scratch-section {
  background: linear-gradient(170deg, var(--blush-pink), var(--warm-white));
}

.scratch-card-container {
  max-width: 450px;
  margin: var(--space-4) auto;
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  background: linear-gradient(135deg, var(--blush-pink), var(--peach));
  border: 2px solid var(--champagne-gold);
}

.scratch-hidden {
  padding: var(--space-6);
  text-align: center;
  position: relative;
}

.scratch-hidden .hidden-label {
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--champagne-gold);
  margin-bottom: var(--space-2);
}

.scratch-hidden .hidden-date {
  font-family: var(--font-heading);
  font-size: 2.5rem;
  color: var(--deep-rose);
  margin-bottom: var(--space-1);
}

.scratch-hidden .hidden-time {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  color: var(--champagne-gold);
}

.scratch-hidden .corner-deco {
  position: absolute;
  width: 40px;
  height: 40px;
  opacity: 0.4;
}
.scratch-hidden .corner-deco.tl { top: 8px; left: 8px; }
.scratch-hidden .corner-deco.tr { top: 8px; right: 8px; transform: scaleX(-1); }
.scratch-hidden .corner-deco.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
.scratch-hidden .corner-deco.br { bottom: 8px; right: 8px; transform: scale(-1, -1); }

.scratch-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  z-index: 2;
}

.scratch-reveal-btn {
  display: block;
  margin: var(--space-2) auto 0;
  font-size: 0.85rem;
  color: var(--neutral-600);
  text-decoration: underline;
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.3s var(--ease);
}
.scratch-reveal-btn:hover {
  color: var(--deep-rose);
}

/* ═══ Gallery ═══ */
.gallery-section {
  background: linear-gradient(180deg, var(--warm-white), var(--neutral-50));
}

.gallery-filters {
  display: flex;
  justify-content: center;
  gap: var(--space-1);
  flex-wrap: wrap;
  margin-bottom: var(--space-4);
}

.gallery-filter {
  padding: 0.5rem 1.25rem;
  border-radius: 50px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--neutral-600);
  background: var(--warm-white);
  border: 1px solid rgba(212, 175, 106, 0.2);
  cursor: pointer;
  transition: all 0.3s var(--ease);
}
.gallery-filter:hover {
  border-color: var(--champagne-gold);
  color: var(--deep-rose);
}
.gallery-filter.active {
  background: linear-gradient(135deg, var(--deep-rose), var(--primary-500));
  color: var(--warm-white);
  border-color: var(--deep-rose);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: var(--space-2);
}

.gallery-item {
  position: relative;
  aspect-ratio: 4/3;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
}
.gallery-item:hover {
  transform: scale(1.03);
  box-shadow: var(--shadow-lg);
}

.gallery-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary-50), var(--accent-50));
  flex-direction: column;
  gap: var(--space-1);
}
.gallery-placeholder .ph-icon {
  font-size: 2rem;
  color: var(--champagne-gold);
  opacity: 0.4;
}
.gallery-placeholder .ph-label {
  font-size: 0.75rem;
  color: var(--neutral-400);
  letter-spacing: 0.1em;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s var(--ease);
}
.gallery-item:hover img {
  transform: scale(1.08);
}

.gallery-item .gallery-cat {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 0.5rem var(--space-2);
  background: linear-gradient(transparent, rgba(68, 59, 67, 0.7));
  color: var(--warm-white);
  font-size: 0.75rem;
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}
.gallery-item:hover .gallery-cat {
  opacity: 1;
}

/* ═══ Lightbox ═══ */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(68, 59, 67, 0.95);
  display: none;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
}
.lightbox.active {
  display: flex;
}

.lightbox-content {
  max-width: 800px;
  max-height: 80vh;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
}

.lightbox-content img,
.lightbox-content .gallery-placeholder {
  width: 100%;
  height: auto;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 16px;
}

.lightbox-close {
  position: absolute;
  top: -40px;
  right: 0;
  background: none;
  border: none;
  color: var(--warm-white);
  font-size: 2rem;
  cursor: pointer;
  padding: 0.5rem;
  line-height: 1;
}

.lightbox-prev,
.lightbox-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: var(--warm-white);
  font-size: 1.5rem;
  padding: 1rem 1.25rem;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.3s var(--ease);
}
.lightbox-prev { left: var(--space-2); }
.lightbox-next { right: var(--space-2); }
.lightbox-prev:hover,
.lightbox-next:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* ═══ RSVP ═══ */
.rsvp-section {
  background: linear-gradient(170deg, var(--primary-50), var(--soft-lavender));
}

.rsvp-form {
  max-width: 600px;
  margin: 0 auto;
  background: var(--warm-white);
  padding: var(--space-5);
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(212, 175, 106, 0.15);
}

.form-group {
  margin-bottom: var(--space-3);
}

.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--charcoal);
  margin-bottom: 0.4rem;
}

.form-label .required {
  color: var(--error-500);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 0.75rem 1rem;
  font-size: 1rem;
  font-family: var(--font-body);
  border: 1.5px solid var(--neutral-200);
  border-radius: 12px;
  background: var(--neutral-50);
  color: var(--charcoal);
  transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  outline: none;
  border-color: var(--champagne-gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 106, 0.15);
}

.form-textarea {
  resize: vertical;
  min-height: 100px;
}

.form-error {
  display: none;
  font-size: 0.8rem;
  color: var(--error-500);
  margin-top: 0.3rem;
}
.form-error.show {
  display: block;
}

.form-radio-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.form-radio-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  border: 1.5px solid var(--neutral-200);
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s var(--ease);
  font-size: 0.9rem;
}
.form-radio-item:has(input:checked) {
  border-color: var(--champagne-gold);
  background: var(--accent-50);
  color: var(--deep-rose);
}
.form-radio-item input {
  accent-color: var(--champagne-gold);
}

.form-submit-btn {
  width: 100%;
  padding: 0.85rem;
  font-size: 1rem;
  margin-top: var(--space-2);
}

.form-message {
  text-align: center;
  padding: var(--space-3);
  border-radius: 12px;
  margin-top: var(--space-2);
  font-size: 0.95rem;
  display: none;
}
.form-message.success {
  display: block;
  background: var(--success-100);
  color: var(--success-500);
}
.form-message.error {
  display: block;
  background: var(--error-100);
  color: var(--error-500);
}

/* ═══ Venue ═══ */
.venue-section {
  background: linear-gradient(180deg, var(--warm-white), var(--accent-50));
}

.venue-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  max-width: 1000px;
  margin: 0 auto;
  background: var(--warm-white);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(212, 175, 106, 0.15);
}

.venue-info {
  padding: var(--space-5);
}

.venue-info h3 {
  font-size: 2rem;
  margin-bottom: var(--space-2);
}

.venue-info-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: var(--space-2);
  font-size: 1rem;
  color: var(--neutral-600);
}
.venue-info-row svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  color: var(--champagne-gold);
}
.venue-info-row .v-label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--champagne-gold);
  display: block;
}
.venue-info-row .v-value {
  font-family: var(--font-heading);
  font-size: 1.2rem;
  color: var(--deep-rose);
}

.venue-map {
  min-height: 350px;
  position: relative;
  background: var(--neutral-100);
}
.venue-map iframe {
  width: 100%;
  height: 100%;
  border: none;
  min-height: 350px;
}
.venue-map-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: var(--space-1);
  height: 100%;
  min-height: 350px;
  color: var(--neutral-600);
  text-align: center;
  padding: var(--space-3);
}

/* ═══ Family ═══ */
.family-section {
  background: linear-gradient(170deg, var(--soft-lavender), var(--warm-white));
}

.family-sides {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.family-side-title {
  text-align: center;
  font-size: 1.5rem;
  margin-bottom: var(--space-3);
  color: var(--deep-rose);
}

.family-members {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.family-card {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: var(--warm-white);
  padding: var(--space-2);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212, 175, 106, 0.15);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.family-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.family-photo {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-50), var(--accent-50));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 2px solid var(--champagne-gold);
}
.family-photo svg {
  width: 28px;
  height: 28px;
  color: var(--champagne-gold);
  opacity: 0.5;
}

.family-info h4 {
  font-size: 1.1rem;
  margin-bottom: 0.1rem;
  color: var(--deep-rose);
}
.family-info .relation {
  font-size: 0.8rem;
  color: var(--champagne-gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.family-info .message {
  font-size: 0.85rem;
  color: var(--neutral-600);
  margin-top: 0.2rem;
  font-style: italic;
}

/* ═══ Hashtag ═══ */
.hashtag-section {
  background: linear-gradient(170deg, var(--blush-pink), var(--peach));
  text-align: center;
}

.hashtag-display {
  font-family: var(--font-heading);
  font-size: clamp(2.5rem, 7vw, 5rem);
  font-weight: 600;
  color: var(--deep-rose);
  margin: var(--space-3) 0;
  letter-spacing: 0.02em;
}

.hashtag-copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.hashtag-copied {
  display: none;
  margin-top: var(--space-2);
  font-size: 0.9rem;
  color: var(--success-500);
}
.hashtag-copied.show {
  display: block;
}

/* ═══ FAQ ═══ */
.faq-section {
  background: linear-gradient(180deg, var(--warm-white), var(--primary-50));
}

.faq-list {
  max-width: 800px;
  margin: 0 auto;
}

.faq-item {
  margin-bottom: var(--space-1);
  background: var(--warm-white);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212, 175, 106, 0.1);
  overflow: hidden;
}

.faq-question {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  font-family: var(--font-heading);
  font-size: 1.2rem;
  color: var(--deep-rose);
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  transition: background 0.3s var(--ease);
}
.faq-question:hover {
  background: var(--primary-50);
}

.faq-icon {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s var(--ease);
  color: var(--champagne-gold);
}
.faq-item.open .faq-icon {
  transform: rotate(45deg);
}

.faq-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s var(--ease);
}
.faq-answer-inner {
  padding: 0 var(--space-3) var(--space-2);
  font-size: 0.95rem;
  color: var(--neutral-600);
  line-height: 1.6;
}

/* ═══ Dress Code ═══ */
.dress-section {
  background: linear-gradient(170deg, var(--neutral-50), var(--warm-white));
}

.dress-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-2);
  max-width: 1000px;
  margin: 0 auto;
}

.dress-card {
  text-align: center;
  padding: var(--space-3);
  border-radius: 16px;
  background: var(--warm-white);
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212, 175, 106, 0.1);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.dress-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}

.dress-card .dress-event {
  font-family: var(--font-heading);
  font-size: 1.3rem;
  color: var(--deep-rose);
  margin-bottom: 0.3rem;
}

.dress-card .dress-suggestion {
  font-size: 0.85rem;
  color: var(--neutral-600);
}

/* ═══ Travel ═══ */
.travel-section {
  background: linear-gradient(180deg, var(--warm-white), var(--accent-50));
}

.travel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--space-2);
  max-width: 1000px;
  margin: 0 auto;
}

.travel-card {
  padding: var(--space-3);
  border-radius: 16px;
  background: var(--warm-white);
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212, 175, 106, 0.1);
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.travel-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.travel-card .travel-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--accent-50);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--champagne-gold);
}
.travel-card .travel-icon svg {
  width: 20px;
  height: 20px;
}

.travel-card h4 {
  font-size: 1.1rem;
  margin-bottom: 0.3rem;
  color: var(--deep-rose);
}
.travel-card p {
  font-size: 0.85rem;
  color: var(--neutral-600);
}
.travel-card h3 {
  margin-bottom: 12px;
}

.travel-card p {
  margin-top: 0;
}
/* ═══ Guestbook ═══ */
.guestbook-section {
  background: linear-gradient(170deg, var(--soft-lavender), var(--primary-50));
}

.guestbook-form {
  max-width: 550px;
  margin: 0 auto var(--space-4);
  background: var(--warm-white);
  padding: var(--space-4);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(212, 175, 106, 0.15);
}

.guestbook-entries {
  max-width: 800px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-2);
}

.guestbook-entry {
  background: var(--warm-white);
  padding: var(--space-3);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(212, 175, 106, 0.1);
  transition: transform 0.3s var(--ease);
}
.guestbook-entry:hover {
  transform: translateY(-3px);
}

.guestbook-entry .entry-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: var(--space-1);
}
.guestbook-entry .entry-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-50), var(--accent-50));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-heading);
  font-size: 1rem;
  color: var(--deep-rose);
  flex-shrink: 0;
}
.guestbook-entry .entry-name {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--deep-rose);
}
.guestbook-entry .entry-reaction {
  font-size: 1.2rem;
}
.guestbook-entry .entry-message {
  font-size: 0.9rem;
  color: var(--neutral-600);
  line-height: 1.5;
}
.guestbook-entry .entry-date {
  font-size: 0.75rem;
  color: var(--neutral-400);
  margin-top: 0.4rem;
}

.emoji-picker {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.4rem;
}
.emoji-btn {
  font-size: 1.3rem;
  background: var(--neutral-50);
  border: 1.5px solid var(--neutral-200);
  border-radius: 10px;
  padding: 0.2rem 0.5rem;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  line-height: 1;
}
.emoji-btn:hover {
  border-color: var(--champagne-gold);
  transform: scale(1.15);
}
.emoji-btn.selected {
  border-color: var(--champagne-gold);
  background: var(--accent-50);
}

/* ═══ Thank You ═══ */
.thank-you-section {
  background: linear-gradient(170deg, var(--blush-pink), var(--primary-50), var(--warm-white));
  text-align: center;
  position: relative;
  overflow: hidden;
}

.thank-you-content {
  max-width: 700px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.thank-you-content h2 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin-bottom: var(--space-3);
}

.thank-you-content p {
  font-size: 1.15rem;
  color: var(--neutral-600);
  margin-bottom: var(--space-4);
  font-style: italic;
}

.thank-you-signature {
  font-family: var(--font-script);
  font-size: 3rem;
  color: var(--deep-rose);
  margin: var(--space-4) 0;
}

.thank-you-illustration {
  max-width: 300px;
  margin: var(--space-4) auto;
}
.thank-you-illustration img {
  width: 280px;
  height: 350px;
  object-fit: cover;
  border-radius: 20px;
  display: block;
  margin: 0 auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.back-to-top {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--warm-white);
  border: 1.5px solid var(--champagne-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 900;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s var(--ease);
  color: var(--deep-rose);
  box-shadow: var(--shadow-md);
}
.back-to-top.visible {
  opacity: 1;
  pointer-events: auto;
}
.back-to-top:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-gold);
}

/* ═══ Footer ═══ */
.footer {
  padding: var(--space-4) var(--space-2);
  text-align: center;
  background: var(--charcoal);
  color: var(--neutral-200);
}
.footer p {
  font-size: 0.9rem;
}
.footer .footer-heart {
  color: var(--champagne-gold);
}

/* ═══ Scroll Reveal ═══ */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ═══ Responsive ═══ */
@media (max-width: 1024px) {
  .hero-content {
    grid-template-columns: 1fr;
    text-align: center;
    gap: var(--space-4);
  }
  .hero-photo {
  width: 280px;
  height: 360px;
  overflow: hidden;
  border-radius: 220px 220px 20px 20px;
  margin: 0 auto;
  }

  .hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  }
  .hero-text {
    text-align: center;
  }
  .hero-subtitle, .hero-invitation {
    margin-left: auto;
    margin-right: auto;
  }
  .hero-details {
    justify-content: center;
  }
  .hero-cta {
    justify-content: center;
  }
  .hero-illustration-wrapper svg {
    max-width: 300px;
  }
}

@media (max-width: 768px) {
  .section {
    padding: var(--space-8) var(--space-2);
  }

  .nav-links {
    position: fixed;
    top: 0;
    right: -100%;
    height: 100vh;
    width: 75%;
    max-width: 320px;
    background: rgba(255, 253, 251, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: var(--space-4);
    transition: right 0.4s var(--ease);
    box-shadow: -10px 0 40px rgba(0,0,0,0.1);
  }
  .nav-links.open {
    right: 0;
  }
  .nav-links a {
    font-size: 1.1rem;
  }
  .nav-toggle {
    display: flex;
  }

  .timeline::before {
    left: 20px;
  }
  .timeline-item:nth-child(odd),
  .timeline-item:nth-child(even) {
    justify-content: flex-end;
  }
  .timeline-item:nth-child(odd) .timeline-content,
  .timeline-item:nth-child(even) .timeline-content {
    width: 80%;
    text-align: left;
    margin-right: 0;
    margin-left: var(--space-6);
  }
  .timeline-marker {
    left: 20px;
  }

  .venue-card {
    grid-template-columns: 1fr;
  }

  .family-sides {
    grid-template-columns: 1fr;
  }

  .countdown-timer {

// ════════════════════════════════════════════════════════════
//  COUPLE ILLUSTRATIONS — SVG cartoon-style Indian bride & groom
//  Each function returns an SVG string for a different event.
//  Colors change per event; character identity stays consistent.
// ════════════════════════════════════════════════════════════

function decorFlowers(color1, color2) {
  let petals = '';
  const positions = [
    [40, 50], [80, 30], [120, 60], [160, 25], [200, 55],
    [30, 200], [70, 220], [110, 210], [150, 225], [190, 200],
    [15, 110], [210, 100],
  ];
  for (const [x, y] of positions) {
    petals += `<g transform="translate(${x},${y})">
      <circle cx="0" cy="-5" r="4" fill="${color1}" opacity="0.6"/>
      <circle cx="5" cy="0" r="4" fill="${color2}" opacity="0.6"/>
      <circle cx="0" cy="5" r="4" fill="${color1}" opacity="0.6"/>
      <circle cx="-5" cy="0" r="4" fill="${color2}" opacity="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#D4AF6A" opacity="0.7"/>
    </g>`;
  }
  return petals;
}

function sparkles(count = 8, area = '0,0,240,240') {
  let s = '';
  const [minX, minY, maxX, maxY] = area.split(',').map(Number);
  for (let i = 0; i < count; i++) {
    const x = minX + Math.random() * (maxX - minX);
    const y = minY + Math.random() * (maxY - minY);
    s += `<g transform="translate(${x},${y})" opacity="0.5">
      <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z" fill="#D4AF6A"/>
    </g>`;
  }
  return s;

function renderNavbar() {
  const navItems = weddingConfig.nav
    .map(
      (item) =>
        `<li><a href="${item.href}" data-nav-link>${item.label}</a></li>`
    )
    .join('');

  return `
    <nav class="navbar" id="navbar" aria-label="Main navigation">
      <a href="#hero" class="nav-logo">R <span class="heart">&#9825;</span> N</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        ${navItems}
      </ul>
    </nav>
  `;
}

function setupNavbar() {
  const navbar = document.getElementById('navbar');
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  const links = navLinks.querySelectorAll('[data-nav-link]');

  let scrolled = false;
  function onScroll() {
    const isScrolled = window.scrollY > 50;
    if (isScrolled !== scrolled) {
      scrolled = isScrolled;
      navbar.classList.toggle('scrolled', scrolled);
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.classList.toggle('active', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });

  links.forEach((link) => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('active');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });
}

// ════════════════════════════════════════════════════════════
//  COUNTDOWN TIMER
// ════════════════════════════════════════════════════════════
function renderCountdown() {
  const { countdown } = weddingConfig;

  return `
    <section class="section countdown-section" id="countdown" aria-label="Countdown to wedding">
      <div class="section-inner">
        <p class="section-label reveal">The Wait Begins</p>
        <h2 class="section-title reveal">${countdown.heading}</h2>
        <div class="gold-divider reveal"><span>&#10047;</span></div>
        <div class="countdown-card reveal">
          <div class="countdown-timer" id="countdownTimer">
            <div class="countdown-unit">
              <div class="countdown-number" id="cd-days">00</div>
              <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-unit">
              <div class="countdown-number" id="cd-hours">00</div>
              <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-unit">
              <div class="countdown-number" id="cd-mins">00</div>
              <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-unit">
              <div class="countdown-number" id="cd-secs">00</div>
              <span class="countdown-label">Seconds</span>
            </div>
          </div>
          <div class="countdown-celebrate" id="cd-celebrate" style="display:none;">
            The wait is over! Wishing Rupa &amp; Naresh a beautiful forever!
          </div>
        </div>
      </div>
    </section>
  `;
}

function setupCountdown() {
  const target = new Date(weddingConfig.countdown.target).getTime();
  const daysEl = document.getElementById('cd-days');
  const hoursEl = document.getElementById('cd-hours');
  const minsEl = document.getElementById('cd-mins');
  const secsEl = document.getElementById('cd-secs');
  const celebrateEl = document.getElementById('cd-celebrate');
  const timerEl = document.getElementById('countdownTimer');

  function pad(n) {
    return String(Math.max(0, n)).padStart(2, '0');
  }

  function update() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      daysEl.textContent = '00';
      hoursEl.textContent = '00';
      minsEl.textContent = '00';
      secsEl.textContent = '00';
      timerEl.style.display = 'none';
      celebrateEl.style.display = 'block';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minsEl.textContent = pad(mins);
    secsEl.textContent = pad(secs);
  }

  update();
  const interval = setInterval(update, 1000);

  // Stop updating after the countdown is over
  const checkInterval = setInterval(() => {
    if (Date.now() >= target) {
      clearInterval(interval);
      clearInterval(checkInterval);
    }
  }, 5000);
}

  const revealBtn = document.getElementById('scratchRevealBtn');

  if (!canvas || !container) return;

  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let revealed = false;

  function setupCanvas() {
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.scale(dpr, dpr);

    // Draw the scratch overlay
    const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
    grad.addColorStop(0, '#E8C544');
    grad.addColorStop(0.5, '#D4AF6A');
    grad.addColorStop(1, '#C9A05A');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, rect.width, rect.height);

    // Decorative pattern
    ctx.fillStyle = 'rgba(255, 253, 251, 0.2)';
    ctx.font = '16px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Scratch to reveal!', rect.width / 2, rect.height / 2 - 10);
    ctx.font = '24px Cormorant Garamond, serif';
    ctx.fillStyle = 'rgba(255, 253, 251, 0.3)';
    ctx.fillText('♥ ✦ ♥', rect.width / 2, rect.height / 2 + 20);

    ctx.globalCompositeOperation = 'destination-out';
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top,
    };
  }

  function scratch(pos) {
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
    ctx.fill();
  }

  function checkReveal() {
    if (revealed) return;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let transparent = 0;
    const total = imageData.data.length / 4;
    const step = Math.max(1, Math.floor(total / 1000));
    for (let i = 0; i < total; i += step) {
      if (imageData.data[i * 4 + 3] < 50) transparent++;
    }
    const ratio = transparent / (total / step);
    if (ratio > 0.5) {
      reveal();
    }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    canvas.style.transition = 'opacity 0.6s ease';
    canvas.style.opacity = '0';
    setTimeout(() => {
      canvas.style.pointerEvents = 'none';
      canvas.style.display = 'none';
    }, 600);
  }

  // Mouse events
  canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    scratch(getPos(e));
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    scratch(getPos(e));
  });
  canvas.addEventListener('mouseup', () => {
    if (isDrawing) {
      isDrawing = false;
      checkReveal();
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if (isDrawing) {
      isDrawing = false;
      checkReveal();
    }
  });

  // Touch events
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isDrawing = true;
    scratch(getPos(e));
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isDrawing) return;
    scratch(getPos(e));
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (isDrawing) {
      isDrawing = false;
      checkReveal();
    }
  });

  // Reveal button (accessible alternative)
  revealBtn.addEventListener('click', reveal);

  // Setup
  setupCanvas();

  // Handle resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    if (revealed) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(setupCanvas, 200);
  });
}

// ════════════════════════════════════════════════════════════
//  GALLERY WITH LIGHTBOX
// ════════════════════════════════════════════════════════════
function renderGallery() {
  const { gallery } = weddingConfig;

  const allCategories = ['All', ...gallery.categories];

  const filters = allCategories
    .map(
      (cat, i) =>
        `<button class="gallery-filter ${i === 0 ? 'active' : ''}" data-category="${cat}">${cat}</button>`
    )
    .join('');

  const items = gallery.images
    .map((img, i) => {
      const inner = img.src
        ? `<img src="${img.src}" alt="${img.alt}" loading="lazy" />`
        : `<div class="gallery-placeholder"><span class="ph-icon">${icon('image')}</span><span class="ph-label">PLACEHOLDER</span></div>`;
      return `
        <div class="gallery-item" data-category="${img.category}" data-index="${i}" tabindex="0" role="button" aria-label="View: ${img.alt}">
          ${inner}
          <div class="gallery-cat">${img.category}</div>
        </div>
      `;
    })
    .join('');

  return `
    <section class="section gallery-section" id="gallery" aria-label="Photo gallery">
      <div class="section-inner">
        <p class="section-label reveal">Cherished Memories</p>
        <h2 class="section-title reveal">${gallery.heading}</h2>
        <div class="gold-divider reveal"><span>&#10047;</span></div>
        <p class="section-subtitle reveal">${gallery.subheading}</p>
        <div class="gallery-filters reveal" id="galleryFilters">
          ${filters}
        </div>
        <div class="gallery-grid reveal" id="galleryGrid">
          ${items}
        </div>
      </div>
    </section>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close image viewer">${icon('x')}</button>
      <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">${icon('chevronLeft')}</button>
      <div class="lightbox-content" id="lightboxContent"></div>
      <button class="lightbox-next" id="lightboxNext" aria-label="Next image">${icon('chevronRight')}</button>
    </div>
  `;
}

function setupGallery() {
  const filters = document.getElementById('galleryFilters');
  const grid = document.getElementById('galleryGrid');
  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightboxContent');
  const closeBtn = document.getElementById('lightboxClose');
  const prevBtn = document.getElementById('lightboxPrev');
  const nextBtn = document.getElementById('lightboxNext');

  const galleryImages = weddingConfig.gallery.images;
  let currentCategory = 'All';
  let currentIndex = 0;

  function getFilteredImages() {
    if (currentCategory === 'All') return galleryImages;
    return galleryImages.filter((img) => img.category === currentCategory);
  }

  function renderLightbox() {
    const filtered = getFilteredImages();
    const img = filtered[currentIndex];
    if (!img) return;
    if (img.src) {
      lightboxContent.innerHTML = `<img src="${img.src}" alt="${img.alt}" />`;
    } else {
      lightboxContent.innerHTML = `<div class="gallery-placeholder" style="min-height:300px;border-radius:16px;"><span class="ph-icon">${icon('image')}</span><span class="ph-label">${img.alt} — Placeholder</span></div>`;
    }
  }

  function openLightbox(index) {
    const filtered = getFilteredImages();
    if (filtered.length === 0) return;
    if (index >= filtered.length) index = 0;
    if (index < 0) index = filtered.length - 1;
    currentIndex = index;
    renderLightbox();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    const filtered = getFilteredImages();
    if (filtered.length === 0) return;
    currentIndex += dir;
    if (currentIndex >= filtered.length) currentIndex = 0;
    if (currentIndex < 0) currentIndex = filtered.length - 1;
    renderLightbox();
  }

  // Filter buttons — single event listener
  filters.addEventListener('click', (e) => {
    const btn = e.target.closest('.gallery-filter');
    if (!btn) return;
    filters.querySelectorAll('.gallery-filter').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.category;

    grid.querySelectorAll('.gallery-item').forEach((item) => {
      const matches =
        currentCategory === 'All' || item.dataset.category === currentCategory;
      item.style.display = matches ? '' : 'none';
    });
  });

  // Gallery item click — open lightbox
  grid.addEventListener('click', (e) => {
    const item = e.target.closest('.gallery-item');
    if (!item || item.style.display === 'none') return;
    const globalIndex = parseInt(item.dataset.index, 10);
    const filtered = getFilteredImages();
    const localIndex = filtered.findIndex(
      (img) => galleryImages.indexOf(img) === globalIndex
    );
    openLightbox(localIndex >= 0 ? localIndex : 0);
  });

  // Keyboard for gallery items
  grid.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('.gallery-item');
    if (!item) return;
    e.preventDefault();
    item.click();
  });

  // Lightbox controls
  closeBtn.addEventListener('click', closeLightbox);
  prevBtn.addEventListener('click', () => navigate(-1));
  nextBtn.addEventListener('click', () => navigate(1));

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });
}

// ════════════════════════════════════════════════════════════
//  RSVP FORM — Stores responses in browser localStorage
// ════════════════════════════════════════════════════════════
function renderRSVP() {
  return `
    <section class="section rsvp-section" id="rsvp" aria-label="RSVP form">

        <div class="gold-divider reveal"><span>&#10047;</span></div>
        <p class="section-subtitle reveal">Your presence and blessings will make our special day even more meaningful.</p>
        <form class="rsvp-form reveal" id="rsvpForm" novalidate>
          <div class="form-group">
            <label for="rsvpName" class="form-label">Guest Name <span class="required">*</span></label>
            <input type="text" id="rsvpName" name="guestName" class="form-input" required aria-required="true" />
            <div class="form-error" id="errName">Please enter your name.</div>
          </div>

          <div class="form-group">
            <label for="rsvpPhone" class="form-label">Phone Number <span class="required">*</span></label>
            <input type="tel" id="rsvpPhone" name="phone" class="form-input" required aria-required="true" />
            <div class="form-error" id="errPhone">Please enter a valid phone number.</div>
          </div>

          <div class="form-group">
  <span class="form-label">
    Which side are you from? <span class="required">*</span>
  </span>

  <div class="form-radio-group">
    <label class="form-radio-item">
      <input
        type="radio"
        name="familySide"
        value="bride"
        required
      />
      Bride's Side
    </label>

    <label class="form-radio-item">
      <input
        type="radio"
        name="familySide"
        value="groom"
      />
      Groom's Side
    </label>
  </div>

  <div class="form-error" id="errFamilySide">
    Please select Bride's Side or Groom's Side.
  </div>
</div>

          <div class="form-group">
            <span class="form-label">Attendance <span class="required">*</span></span>
            <div class="form-radio-group">
              <label class="form-radio-item">
                <input type="radio" name="attendance" value="yes" required /> Yes, I'll be there
              </label>
              <label class="form-radio-item">
                <input type="radio" name="attendance" value="no" /> Sorry, I can't attend
              </label>
              <label class="form-radio-item">
                <input type="radio" name="attendance" value="maybe" /> Maybe
              </label>
            </div>
            <div class="form-error" id="errAttendance">Please select your attendance.</div>
          </div>

          <div class="form-group">
            <span class="form-label">Meal Preference</span>
            <div class="form-radio-group">
              <label class="form-radio-item">
                <input type="radio" name="mealPreference" value="vegetarian" /> Vegetarian
              </label>
              <label class="form-radio-item">
                <input type="radio" name="mealPreference" value="non-vegetarian" /> Non-Vegetarian
              </label>
              <label class="form-radio-item">
                <input type="radio" name="mealPreference" value="jain" /> Jain
              </label>
              <label class="form-radio-item">
                <input type="radio" name="mealPreference" value="other" /> Other
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="rsvpMessage" class="form-label">Message <span style="color:var(--neutral-400);font-size:0.8rem;">(Optional)</span></label>
            <textarea id="rsvpMessage" name="message" class="form-textarea" placeholder="Share your wishes or any special notes..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary form-submit-btn" id="rsvpSubmit">
            Send Your Response
          </button>

          <div class="form-message" id="rsvpMessageBox"></div>
        </form>
      </div>
    </section>
  `;
}

function setupRSVP() {
  const form = document.getElementById('rsvpForm');
  const submitBtn = document.getElementById('rsvpSubmit');
  const messageBox = document.getElementById('rsvpMessageBox');

  function showError(id, show) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.toggle('show', show);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Clear previous errors
    showError('errName', false);
    showError('errPhone', false);
    showError('errFamilySide', false);
    showError('errAttendance', false);

    messageBox.className = 'form-message';
    messageBox.textContent = '';

    // Get form values
    const name = form.guestName.value.trim();
    const phone = form.phone.value.trim();

    const familySideEl =
      form.querySelector('input[name="familySide"]:checked');

    const attendanceEl =
      form.querySelector('input[name="attendance"]:checked');

    const mealEl =
      form.querySelector('input[name="mealPreference"]:checked');

    const message = form.message.value.trim();

    // Validation
    let valid = true;

    if (!name) {
      showError('errName', true);
      valid = false;
    }

    if (!phone || phone.replace(/\D/g, '').length < 7) {
      showError('errPhone', true);
      valid = false;
    }

    if (!familySideEl) {
      showError('errFamilySide', true);
      valid = false;
    }

    if (!attendanceEl) {
      showError('errAttendance', true);
      valid = false;
    }

    if (!valid) {
      return;
    }

    // Get selected side
    const familySide = familySideEl.value;

    const familySideText =
      familySide === 'bride'
        ? "Bride's Side"
        : "Groom's Side";

    // Select WhatsApp number
    const whatsappNumber =
      familySide === 'bride'
        ? weddingConfig.contacts.brideWhatsApp
        : weddingConfig.contacts.groomWhatsApp;

    // Create RSVP details
    const attendanceText = {
      yes: "Yes, I'll be there",
      no: "Sorry, I can't attend",
      maybe: "Maybe"
    };

    const mealText = mealEl
      ? mealEl.value
      : "Not specified";

    // WhatsApp message
    const whatsappMessage = `
💍 *Wedding RSVP*

👤 Guest Name: ${name}

📱 Phone: ${phone}

👨‍👩‍👧‍👦 Side: ${familySideText}

📅 Attendance: ${attendanceText[attendanceEl.value]}

🍽️ Meal Preference: ${mealText}

💌 Message:
${message || "No message"}

Thank you!
`.trim();

    // Save locally as backup
    const payload = {
      guest_name: name,
      phone: phone,
      family_side: familySide,
      attendance: attendanceEl.value,
      meal_preference: mealEl ? mealEl.value : null,
      message: message || null,
      created_at: new Date().toISOString()
    };

    try {

      const responses = JSON.parse(
        localStorage.getItem('wedding_rsvp_responses') || '[]'
      );

      responses.unshift(payload);

      localStorage.setItem(
        'wedding_rsvp_responses',
        JSON.stringify(responses)
      );

      // Create WhatsApp URL
      const whatsappURL =
        `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(
          whatsappMessage
        )}`;

      // Success message
      messageBox.classList.add('success');

      messageBox.textContent =
        `Thank you, ${name}! Opening WhatsApp...`;

      // Reset form
      form.reset();

      // Open WhatsApp
      setTimeout(() => {
        window.open(
          whatsappURL,
          '_blank',
          'noopener,noreferrer'
        );
      }, 500);

    } catch (err) {

      console.error(err);

      messageBox.classList.add('error');

      messageBox.textContent =
        'Something went wrong. Please try again.';
    }
  });
}

function setupHashtag() {
  const copyBtn = document.getElementById('hashtagCopyBtn');
  const copiedMsg = document.getElementById('hashtagCopied');
  const hashtag = weddingConfig.wedding.hashtag;

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(hashtag);
    } catch {
      // Fallback
      const textarea = document.createElement('textarea');
      textarea.value = hashtag;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }
    copiedMsg.classList.add('show');
    setTimeout(() => copiedMsg.classList.remove('show'), 2500);
  });
}

            <p>${t.content}</p>
          </div>
        </div>
      `;
    })
    .join('');

  return `
    <section class="section travel-section" id="travel" aria-label="Travel and accommodation">
      <div class="section-inner">
        <p class="section-label reveal">Plan Your Visit</p>
        <h2 class="section-title reveal">Travel &amp; Stay</h2>
        <div class="gold-divider reveal"><span>&#10047;</span></div>
        <p class="section-subtitle reveal">Useful information to help you plan your journey to celebrate with us.</p>
        <div class="travel-grid">
          ${items}
        </div>
      </div>
    </section>
  `;
}

function renderGuestbook() {
  const { guestbook } = weddingConfig;

  return `
    <section class="section guestbook-section" id="guestbook" aria-label="Guestbook">
      <div class="section-inner">
        <p class="section-label reveal">Share Your Wishes</p>
        <h2 class="section-title reveal">${guestbook.heading}</h2>
        <div class="gold-divider reveal"><span>&#10047;</span></div>
        <form class="guestbook-form reveal" id="guestbookForm" novalidate>
          <div class="form-group">
            <label for="gbName" class="form-label">Your Name <span class="required">*</span></label>
            <input type="text" id="gbName" name="gbName" class="form-input" required aria-required="true" />
            <div class="form-error" id="gbErrName">Please enter your name.</div>
          </div>
          <div class="form-group">
            <label for="gbMessage" class="form-label">Your Message <span class="required">*</span></label>
            <textarea id="gbMessage" name="gbMessage" class="form-textarea" required aria-required="true" placeholder="Write your wishes for Rupa & Naresh..." maxlength="500"></textarea>
            <div class="form-error" id="gbErrMessage">Please enter a message.</div>
          </div>
          <div class="form-group">
            <span class="form-label">Add a reaction</span>
            <div class="emoji-picker" id="emojiPicker">
              <button type="button" class="emoji-btn" data-emoji="&#10084;">&#10084;</button>
              <button type="button" class="emoji-btn" data-emoji="&#128150;">&#128150;</button>
              <button type="button" class="emoji-btn" data-emoji="&#128588;">&#128588;</button>
              <button type="button" class="emoji-btn" data-emoji="&#127881;">&#127881;</button>
              <button type="button" class="emoji-btn" data-emoji="&#128591;">&#128591;</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary form-submit-btn" id="gbSubmit">
            Share Your Wishes
          </button>
          <div class="form-message" id="gbMessageBox"></div>
        </form>
        <div class="guestbook-entries" id="guestbookEntries" aria-live="polite"></div>
      </div>
    </section>
  `;
}

function setupGuestbook() {
  const form = document.getElementById('guestbookForm');
  const submitBtn = document.getElementById('gbSubmit');
  const messageBox = document.getElementById('gbMessageBox');
  const entriesContainer = document.getElementById('guestbookEntries');
  const emojiPicker = document.getElementById('emojiPicker');
  let selectedEmoji = null;

  // Emoji selection
  emojiPicker.addEventListener('click', (e) => {
    const btn = e.target.closest('.emoji-btn');
    if (!btn) return;
    emojiPicker.querySelectorAll('.emoji-btn').forEach((b) => b.classList.remove('selected'));
    if (selectedEmoji === btn.dataset.emoji) {
      selectedEmoji = null;
    } else {
      selectedEmoji = btn.dataset.emoji;
      btn.classList.add('selected');
    }
  });

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric',
    });
  }

  function renderEntries(entries) {
    if (!entries || entries.length === 0) {
      entriesContainer.innerHTML = `
        <p style="text-align:center;color:var(--neutral-400);grid-column:1/-1;padding:2rem;">
          Be the first to leave a wish for Rupa &amp; Naresh!
        </p>`;
      return;
    }

    entriesContainer.innerHTML = entries
      .map((entry) => {
        const initial = entry.guest_name.charAt(0).toUpperCase();
        const reaction = entry.reaction
          ? `<span class="entry-reaction">${entry.reaction}</span>`
          : '';
        return `
          <div class="guestbook-entry reveal">
            <div class="entry-header">
              <div class="entry-avatar">${escapeHTML(initial)}</div>
              <span class="entry-name">${escapeHTML(entry.guest_name)}</span>
              ${reaction}
            </div>
            <p class="entry-message">${escapeHTML(entry.message)}</p>
            <div class="entry-date">${formatDate(entry.created_at)}</div>
          </div>
        `;
      })
      .join('');

    // Re-trigger reveal for new entries
    entriesContainer.querySelectorAll('.reveal').forEach((el) => {
      el.classList.add('visible');
    });
  }

  function loadEntries() {
    try {
      const entries = JSON.parse(localStorage.getItem('wedding_guestbook') || '[]');
      renderEntries(entries.slice(0, 20));
    } catch {
      renderEntries([]);
    }
  }

  function showError(id, show) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('show', show);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    showError('gbErrName', false);
    showError('gbErrMessage', false);
    messageBox.className = 'form-message';
    messageBox.textContent = '';

    const name = form.gbName.value.trim();
    const message = form.gbMessage.value.trim();

    let valid = true;
    if (!name) {
      showError('gbErrName', true);
      valid = false;
    }
    if (!message) {
      showError('gbErrMessage', true);
      valid = false;
    }
    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sharing...';

    try {
      const entries = JSON.parse(localStorage.getItem('wedding_guestbook') || '[]');
      entries.unshift({
        guest_name: name,
        message: message,
        reaction: selectedEmoji,
        created_at: new Date().toISOString(),
      });
      localStorage.setItem('wedding_guestbook', JSON.stringify(entries.slice(0, 20)));

      messageBox.classList.add('success');
      messageBox.textContent = 'Thank you for your wishes! Your message has been added.';
      form.reset();
      emojiPicker.querySelectorAll('.emoji-btn').forEach((b) => b.classList.remove('selected'));
      selectedEmoji = null;
      loadEntries();
    } catch {
      messageBox.classList.add('error');
      messageBox.textContent =
        'Something went wrong while sharing your message. Please try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Share Your Wishes';
    }
  });

  loadEntries();
}

// ===== src/utils/scrollReveal.js =====
// ════════════════════════════════════════════════════════════
//  SCROLL REVEAL — Intersection Observer utility
// ════════════════════════════════════════════════════════════

function setupScrollReveal() {
  const prefersReducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  const elements = document.querySelectorAll('.reveal');

  if (prefersReducedMotion) {
    elements.forEach((el) => el.classList.add('visible'));
    return;
  }

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    },
    {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px',
    }
  );

  elements.forEach((el) => observer.observe(el));
}
